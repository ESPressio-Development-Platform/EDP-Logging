name: EDP-Logging Host Foundations

on:
  push:
    branches:
      - main
      - feature/logging-v1
  pull_request:
  workflow_dispatch:

jobs:
  python-tooling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded host decoder unit tests
        run: PYTHONPATH=tools python3 -m unittest discover -s tools/tests -v

  cpp-foundations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Compile and run C++20 sequence foundation tests
        run: bash tests/run-host-tests.sh


  historical-archive-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EDP-Logging source
        uses: actions/checkout@v4
        with:
          path: EDP-Logging
      - name: Checkout EDP-Localisation historical archive owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Localisation
          ref: main
          path: EDP-Localisation
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run strict historical EDPL and Logging schema bridge tests
        env:
          EDP_LOCALISATION_SOURCE_DIR: ${{ github.workspace }}/EDP-Localisation
        run: bash EDP-Logging/tests/run-historical-schema-tests.sh

  transactional-record-fifo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - name: Checkout Logging
        uses: actions/checkout@v4
        with:
          path: EDP-Logging
      - name: Checkout Memory owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Memory
          ref: main
          path: EDP-Memory
      - name: Checkout Threading owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Threading
          ref: main
          path: EDP-Threading
      - name: Checkout Clock owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Clock
          ref: main
          path: EDP-Clock
      - name: Checkout System owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-System
          ref: main
          path: EDP-System
      - name: Checkout Platform abstraction owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform
          ref: main
          path: EDP-Platform
      - name: Checkout BoundedTopology owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTopology
          ref: main
          path: EDP-BoundedTopology
      - name: Checkout Localisation owner for generated strong StringIdentifier types
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Localisation
          ref: main
          path: EDP-Localisation
      - name: Checkout abstract EDP-Serial copying-sink owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Serial
          ref: main
          path: EDP-Serial
      - name: Checkout Serialisation owner for approved G4 child-field wire
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Serialisation
          ref: main
          path: EDP-Serialisation
      - name: Checkout BoundedTypes conversion owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTypes
          ref: main
          path: EDP-BoundedTypes
      - name: Checkout Platform-Portable ByteOperations owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform-Portable
          ref: main
          path: EDP-Platform-Portable
      - name: G4 approved Field11 Field14 canonical CBOR JSON regression
        env:
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-g4-approved-field-wire-tests.sh
      - name: G4 owner core-field CBOR JSON conversion and rejection
        env:
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-g4-core-field-wire-tests.sh
      - name: G4 source-owned bounded positional CBOR JSON re-encoding
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-diagnostic-bounded-generated-tests.sh
      - name: G4 generated strong argument source ownership and canonical positionals
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-diagnostic-generated-contract-tests.sh
      - name: G10 copied asynchronous Task owner, terminal reclaim and backpressure
        env:
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-async-copying-sink-tests.sh ${{ matrix.compiler }}
      - name: Run G10 one-sink and two-sink owner-composed lifetime regression
        env:
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-owned-representation-fanout-tests.sh ${{ matrix.compiler }}
      - name: Verify permanent System-governed LogRecord identity and golden bytes
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-log-record-identity-tests.sh
      - name: Compile and run bounded queue-before-Memory admission tests
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-bounded-record-admission-tests.sh
      - name: Compile and run owner-integrated transactional FIFO tests
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-transactional-record-queue-tests.sh
      - name: Standalone Clock source producer-consumer admission tests
        env:
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-record-production-tests.sh ${{ matrix.compiler }}

      - name: Service optional sink deadlines through the existing coordinator
        env:
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-coordinator-sink-service-tests.sh ${{ matrix.compiler }}

  bounded-edlg-persistence-checkpoint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - name: Checkout Logging optional Persistence consumer
        uses: actions/checkout@v4
        with:
          path: EDP-Logging
      - name: Checkout owning EDP-Persistence abstraction
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Persistence
          ref: main
          path: EDP-Persistence
      - name: Checkout EDP-System Composition
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-System
          ref: main
          path: EDP-System
      - name: Checkout EDP-Platform abstraction
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform
          ref: main
          path: EDP-Platform
      - name: Run PowerLoss key-value EDLS snapshot owner tests
        env:
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-powerloss-edls-snapshots-tests.sh ${{ matrix.compiler }}
      - name: Run bounded malformed/truncated/provider-fault checkpoints
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-edlg-checkpoint-tests.sh
      - name: Checkout EDP-Persistence ESP-IDF VFS owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Persistence-ESP-IDF
          ref: main
          path: EDP-Persistence-ESP-IDF
      - name: Checkout EDP-Memory abstraction
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Memory
          ref: main
          path: EDP-Memory
      - name: Checkout EDP-Platform-Portable ByteOperations provider
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform-Portable
          ref: main
          path: EDP-Platform-Portable
      - name: Checkout EDP-BoundedTopology owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTopology
          ref: main
          path: EDP-BoundedTopology
      - name: Checkout EDP-Threading owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Threading
          ref: main
          path: EDP-Threading
      - name: Checkout EDP-Clock abstraction
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Clock
          ref: main
          path: EDP-Clock
      - name: Checkout EDP-Serialisation canonical CBOR owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Serialisation
          ref: main
          path: EDP-Serialisation
      - name: Checkout EDP-Localisation schema generator
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Localisation
          ref: main
          path: EDP-Localisation
      - name: Checkout EDP-BoundedTypes declared owner types
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTypes
          ref: main
          path: EDP-BoundedTypes
      - name: Generate LogRecord canonical CBOR and persist through real EDLS rolling
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-generated-edls-archive-integration-tests.sh
      - name: Validate PowerLoss KeyValue watermark and recover torn EDLS candidate
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-edls-powerloss-acknowledgement-tests.sh
      - name: Qualify existing Memory pool and deferred Threading Task typed EDLS archive
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-generated-edls-async-task-integration-tests.sh
      - name: Verify full typed Task delivery with independent durable PowerLoss NVS acknowledgement
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-generated-edls-strict-ack-task-integration-tests.sh
      - name: Run bounded EDLS FileStorage read-only recovery tests
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
          EDP_INSPECTION_UBSAN: "1"
        run: bash EDP-Logging/tests/run-edls-archive-inspection-tests.sh
      - name: Test real EDP-Persistence VFS provider and guarded archive successor
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-real-vfs-successor-tests.sh

      - name: Compile and test finite N+1 protected immutable EDLS rotation
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-edls-protected-rolling-tests.sh
      - name: Independently reopen real VFS EDLS rolling and resume retirement
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-real-vfs-protected-rolling-tests.sh
      - name: Install UART host test dependency
        run: python3 -m pip install pyserial
      - name: Qualify real EDLS LittleFS power-cut monitor classification and offline archive evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/EDP-Logging/tools
        run: python3 -m unittest discover -s EDP-Logging/tests/hil/g7-littlefs-protected-rolling-espidf -p "test_*.py" -v

      - name: Verify configurable sealed batching and uncertain ACK negatives
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
          EDP_BATCH_UBSAN: "1"
        run: bash EDP-Logging/tests/run-bounded-edls-batch-tests.sh

      - name: Distinguish batched RAM Task acceptance from durable sink completions
        env:
          CXX: ${{ matrix.compiler }}
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash EDP-Logging/tests/run-generated-edls-batch-service-integration-tests.sh
