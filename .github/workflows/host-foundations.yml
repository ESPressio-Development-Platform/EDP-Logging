name: EDP-Logging Host Foundations

on:
  push:
    branches:
      - main
      - feature/logging-v1
  pull_request:
  workflow_dispatch:

jobs:
  python-tooling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded host decoder unit tests
        run: PYTHONPATH=tools python3 -m unittest discover -s tools/tests -v

  cpp-foundations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Compile and run C++20 sequence foundation tests
        run: bash tests/run-host-tests.sh


  historical-archive-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EDP-Logging feature source
        uses: actions/checkout@v4
        with:
          path: EDP-Logging
      - name: Checkout EDP-Localisation historical archive owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Localisation
          ref: feature/logging-v1
          path: EDP-Localisation
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run strict historical EDPL and Logging schema bridge tests
        env:
          EDP_LOCALISATION_SOURCE_DIR: ${{ github.workspace }}/EDP-Localisation
        run: bash EDP-Logging/tests/run-historical-schema-tests.sh
