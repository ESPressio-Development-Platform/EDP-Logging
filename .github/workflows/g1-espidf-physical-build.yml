name: EDP-Logging G1 ESP32-WROOM Firmware Build

on:
  push:
    branches: [main, feature/logging-v1]
  pull_request:
  workflow_dispatch:

jobs:
  espidf-wroom-compile-and-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Logging source
        uses: actions/checkout@v4
        with:
          path: EDP-Logging
      - name: Checkout Memory owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Memory
          ref: main
          path: EDP-Memory
      - name: Checkout Serialisation owner for canonical CBOR fixture
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Serialisation
          ref: main
          path: EDP-Serialisation
      - name: Checkout Localisation dependency of Serialisation
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Localisation
          ref: main
          path: EDP-Localisation
      - name: Checkout Serial abstract owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Serial
          ref: main
          path: EDP-Serial
      - name: Checkout Serial ESP-IDF native provider
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Serial-ESP-IDF
          ref: main
          path: EDP-Serial-ESP-IDF
      - name: Checkout Persistence abstract owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Persistence
          ref: main
          path: EDP-Persistence
      - name: Checkout Persistence ESP-IDF NVS provider
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Persistence-ESP-IDF
          ref: main
          path: EDP-Persistence-ESP-IDF
      - name: Checkout Threading owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Threading
          ref: main
          path: EDP-Threading
      - name: Checkout Clock owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Clock
          ref: main
          path: EDP-Clock
      - name: Checkout System owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-System
          ref: main
          path: EDP-System
      - name: Checkout BoundedTopology owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTopology
          ref: main
          path: EDP-BoundedTopology
      - name: Checkout BoundedTypes owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTypes
          ref: main
          path: EDP-BoundedTypes
      - name: Checkout abstract Platform owner
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform
          ref: main
          path: EDP-Platform
      - name: Checkout FreeRTOS concrete (application composition only)
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform-FreeRTOS
          ref: main
          path: EDP-Platform-FreeRTOS
      - name: Checkout ESP-IDF canonical monotonic timebase (native fixture only)
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform-ESP-IDF
          ref: adc4164031016c200ad88d742fc4f05c86d66833
          path: EDP-Platform-ESP-IDF
      - name: Checkout Portable memory resource (application composition only)
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform-Portable
          ref: main
          path: EDP-Platform-Portable
      - name: Prepare Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Record exact checked-out dependency commit pins
        run: |
          for repo in EDP-Logging EDP-Serialisation EDP-Localisation EDP-Serial EDP-Serial-ESP-IDF EDP-Persistence EDP-Persistence-ESP-IDF EDP-Memory EDP-Threading EDP-Clock EDP-System EDP-BoundedTopology EDP-BoundedTypes EDP-Platform EDP-Platform-FreeRTOS EDP-Platform-ESP-IDF EDP-Platform-Portable; do
            printf '%s=' "$repo"
            git -C "$repo" rev-parse HEAD
          done
      - name: Compile and link ESP-IDF physical HIL firmware (not an actual device test)
        working-directory: EDP-Logging/tests/hil/g1-espidf
        env:
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: |
          python3 generate_g4_root_fixture.py "$EDP_LOGGING_DEPENDENCY_ROOT/EDP-Localisation" "$PWD/src/generated"
          pio run -e esp32dev

      - name: Generate typed Localisation contract and compile strict NVS-ACKed EDLS (build only)
        working-directory: EDP-Logging
        env:
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash tests/hil/g7-littlefs-protected-rolling-espidf/build_typed_strict.sh
      - name: Compile configurable sealed-batch and power-cut fixtures (build only)
        working-directory: EDP-Logging
        env:
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: |
          for environment in esp32dev-sealed-batch esp32dev-sealed-batch-cut esp32dev-sealed-batch-64 esp32dev-sealed-batch-64-cut; do
            EDP_LFS_BUILD_ENV="$environment" bash tests/hil/g7-littlefs-protected-rolling-espidf/build_typed_strict.sh
          done
      - name: Build test-only timed strict EDLS real-provider attribution firmware (compile only)
        working-directory: EDP-Logging
        env:
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: bash tests/hil/g7-littlefs-protected-rolling-espidf/build_edls_provider_profile.sh
      - name: Run G11 site evidence negative tests
        working-directory: EDP-Logging
        run: python3 tests/test_g11_site_evidence.py
      - name: Compare G11 whole-firmware Off and On linked images (build-only)
        working-directory: EDP-Logging
        env:
          EDP_LOGGING_DEPENDENCY_ROOT: ${{ github.workspace }}
          G11_REPORT_DIR: ${{ runner.temp }}/edp-logging-g11-images
        run: bash tests/run-g11-whole-firmware-comparison.sh


      - name: Build the three public demos for both PlatformIO frameworks
        working-directory: EDP-Logging
        run: |
          for target in PlatformIO_Arduino PlatformIO_ESP-IDF; do
            pio run -d "demos/FramingAndInstrumentation/$target" -j 2
          done
          for demo in ConfigurableBoundedEdlsBatch TypedManagedBatchWorker; do
            for target in platformio-arduino espidf; do
              bash "demos/$demo/build.sh" "$target"
            done
          done
