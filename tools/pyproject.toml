[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edp-logging"
version = "0.1.0"
description = "Offline and live structured diagnostic frame tooling for ESPressio"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
edp-logging = "edp_logging.cli:main"

[tool.setuptools]
packages = ["edp_logging"]
