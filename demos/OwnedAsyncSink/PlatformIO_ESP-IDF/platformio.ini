[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32.git#d41d8383706dc146fd91a0e1d3c59a915a4d493e
board = esp32dev
framework = espidf
monitor_speed = 115200
lib_ldf_mode = off
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
    -Og
    -Os
    -O0
    -O1
build_flags =
    -std=gnu++20
    -O2
    -I../../../src
    -I../../../../EDP-Platform-ESP-IDF/src
    -I../../../../EDP-Platform-FreeRTOS/src
    -I../../../../EDP-Memory/src
    -I../../../../EDP-Platform-Portable/src
    -I../../../../EDP-Platform/src
    -I../../../../EDP-System/src
    -I../../../../EDP-BoundedTopology/src
    -I../../../../EDP-Clock/src
    -I../../../../EDP-Threading/src
