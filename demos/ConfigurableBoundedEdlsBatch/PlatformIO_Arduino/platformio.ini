[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32.git#d41d8383706dc146fd91a0e1d3c59a915a4d493e
board = esp32dev
framework = arduino
extra_scripts = pre:configure_framework.py
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/archive/refs/tags/3.3.12.zip
    framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/esp32-arduino-libs-idf-release_v5.5-b774170f-v3.zip
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.flash_size = 2MB
lib_ldf_mode = chain+
build_unflags = -std=gnu++11 -std=gnu++17 -Og -Os -O0 -O1
build_flags =
    -std=gnu++20
    -I../../../src
    -I../../../../EDP-Persistence/src
    -I../../../../EDP-Persistence-ESP-IDF/src
    -I../../../../EDP-Memory/src
    -I../../../../EDP-Platform/src
    -I../../../../EDP-Platform-Portable/src
    -I../../../../EDP-System/src
    -I../../../../EDP-BoundedTopology/src
    -I../../../../EDP-BoundedTypes/src
    -I../../../../EDP-Serialisation/src
    -I../../../../EDP-Localisation/src
    -I../../../../EDP-Clock/src
    -I../../../../EDP-Platform-ESP-IDF/src
    -O2
