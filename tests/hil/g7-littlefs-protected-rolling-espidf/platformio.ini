[env:esp32dev-sealed-batch]
extends = env:esp32dev-typed-strict
build_flags =
    ${env:esp32dev-typed-strict.build_flags}
    -DEDP_TEST_SEALED_BATCH
    -I../../../../EDP-Platform-ESP-IDF/src

[env:esp32dev-sealed-batch-cut]
extends = env:esp32dev-sealed-batch
build_flags =
    ${env:esp32dev-sealed-batch.build_flags}
    -DEDP_TEST_SEALED_BATCH_CUT

[env:esp32dev-sealed-batch-64]
extends = env:esp32dev-sealed-batch
build_flags =
    ${env:esp32dev-sealed-batch.build_flags}
    -DEDP_TEST_BATCH_RECORDS=64U

[env:esp32dev-sealed-batch-64-cut]
extends = env:esp32dev-sealed-batch-64
build_flags =
    ${env:esp32dev-sealed-batch-64.build_flags}
    -DEDP_TEST_SEALED_BATCH_CUT

[env:esp32dev-batch-worker]
extends = env:esp32dev-sealed-batch-64
build_flags =
    ${env:esp32dev-sealed-batch-64.build_flags}
    -DEDP_TEST_BATCH_WORKER
    -I../../../../EDP-Threading/src
    -I../../../../EDP-Platform-FreeRTOS/src

[env:esp32dev-batch-worker-500]
extends = env:esp32dev-batch-worker
build_flags =
    ${env:esp32dev-batch-worker.build_flags}
    -DEDP_WORKER_DWELL_NS=500000000LL

[env:esp32dev-batch-worker-500-o2]
extends = env:esp32dev-batch-worker-500
build_unflags =
    -Og
    -Os
    -O0
    -O1
build_flags =
    ${env:esp32dev-batch-worker-500.build_flags}
    -O2
    -DEDP_WORKER_OPTIMISED_BUILD=1

[env:esp32dev-batch-worker-500-o2-6000]
extends = env:esp32dev-batch-worker-500-o2
build_flags =
    ${env:esp32dev-batch-worker-500-o2.build_flags}
    -DEDP_WORKER_RECORDS_PER_PRODUCER=3000U

[env:esp32dev-sealed-batch-64-writecut]
extends = env:esp32dev-sealed-batch-64-cut
build_flags =
    ${env:esp32dev-sealed-batch-64-cut.build_flags}
    -DEDP_TEST_SEALED_WRITE_ACTIVITY_CUT

[env:esp32dev-batch-worker-500-o2-writecut]
extends = env:esp32dev-batch-worker-500-o2
build_flags =
    ${env:esp32dev-batch-worker-500-o2.build_flags}
    -DEDP_TEST_SEALED_WRITE_ACTIVITY_CUT
    -DEDP_WORKER_POWER_CUT

[env:esp32dev-batch-worker-500-o2-capacitycut]
extends = env:esp32dev-batch-worker-500-o2-writecut
build_flags =
    ${env:esp32dev-batch-worker-500-o2-writecut.build_flags}
    -DEDP_WORKER_CAPACITY_CUT
    -DEDP_TEST_EDLS_LOWSPACE
