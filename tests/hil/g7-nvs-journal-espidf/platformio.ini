[env:esp32dev]
; Exact pioarduino/ESP-IDF toolchain baseline previously validated by EDP-Threading.
platform = https://github.com/pioarduino/platform-espressif32.git#d41d8383706dc146fd91a0e1d3c59a915a4d493e
board = esp32dev
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200
; EDP_LOGGING_DEPENDENCY_ROOT is a caller-controlled directory with exact
; checked-out EDP-* owners. Do NOT let PlatformIO resolve transitive main
; branches from library.json, as this would violate the pinned test topology.
lib_ldf_mode = off
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -std=gnu++20
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Logging/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Serial/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Serial-ESP-IDF/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Persistence/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Persistence-ESP-IDF/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Memory/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Serialisation/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Localisation/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Threading/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Clock/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-System/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-BoundedTopology/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-BoundedTypes/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Platform/src
    ; ESP-IDF concrete owner selection precedes the FreeRTOS sibling
    ; because the application explicitly includes its execution/ header.
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Platform-ESP-IDF/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Platform-FreeRTOS/src
    -I${sysenv.EDP_LOGGING_DEPENDENCY_ROOT}/EDP-Platform-Portable/src
    -Isrc/generated
